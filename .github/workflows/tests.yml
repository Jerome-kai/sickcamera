name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest interpreter the project claims to support, and a current one.
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and its test dependencies
        # The hardware-only wheels (spidev, gpiod, opencv) live in
        # requirements.txt and are not needed here: the suite fakes the SPI
        # bus, the GPIO lines and the camera, so it runs on any machine.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./software[test]"

      - name: Run the test suite
        working-directory: software
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=45
