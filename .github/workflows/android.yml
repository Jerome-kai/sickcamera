name: Android app

on:
  push:
    branches: [main, claude/zen-volta-lvFjq]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # publishing the release on main
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core logic tests
        working-directory: android/core
        run: ../gradlew test --console=plain

      # Optional private signing key. Without these secrets the APK is signed with
      # the PUBLIC fallback key in android/signing/: updates still install in
      # place, but the key is not a secret. See android/README.md.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LATENT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/latent.keystore"
            echo "LATENT_KEYSTORE_PATH=$RUNNER_TEMP/latent.keystore" >> "$GITHUB_ENV"
            echo "Signing with the stored release key."
          else
            echo "::warning::No LATENT_KEYSTORE_BASE64 secret; signing with the public fallback key (updates work, but anyone could sign as you)."
          fi

      - name: Build release APK
        env:
          LATENT_BUILD_NUMBER: ${{ github.run_number }}
          LATENT_KEYSTORE_PASSWORD: ${{ secrets.LATENT_KEYSTORE_PASSWORD }}
          LATENT_KEY_ALIAS: ${{ secrets.LATENT_KEY_ALIAS }}
          LATENT_KEY_PASSWORD: ${{ secrets.LATENT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Name the APK
        id: apk
        run: |
          name="latent-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=android/$name" >> "$GITHUB_OUTPUT"
          ls -la "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      # A release gives the phone a plain download link -- no GitHub login and
      # no zip to unpack, which an Actions artifact would need. Builds from the
      # dev branch are published as prereleases so they never pose as stable.
      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/zen-volta-lvFjq'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latent-v1.0.${{ github.run_number }}
          name: Latent 1.0.${{ github.run_number }}
          # Pin the tag to the commit that was built, not the default branch head.
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Android build of the camera.

            **Install:** open this page on your phone, tap the APK below, and allow
            installs from your browser when Android asks. Builds install over each
            other, so your prompts, photos and API key survive updates.

            Commit ${{ github.sha }}
          files: ${{ steps.apk.outputs.path }}
