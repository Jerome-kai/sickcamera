[project]
name = "imagegencam"
version = "0.1.0"
description = "ImageGenCam ported to Orange Pi Zero 2: ST7796 SPI display, USB camera, GPIO buttons, OpenAI-compatible image edits."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.109.0",
  "qrcode>=8.2",
  "Pillow>=10.0.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/imagegencam"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
