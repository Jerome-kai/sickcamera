# The SPI display writes a whole 480x320 RGB565 frame (307200 bytes) per
# refresh. spidev's default 4096-byte buffer splits that into 75 separate
# transfers, and the SPI clock idles between every one -- overhead that lands
# straight on the frame rate, on top of the ~61ms the bits themselves take at
# 40MHz. A 64KB buffer cuts it to 5 transfers.
#
# Only applies when spidev is a loadable module. If it is built into the
# kernel, put spidev.bufsiz=65536 on the kernel command line instead
# (Armbian: the `extraargs=` line in /boot/armbianEnv.txt), then reboot.
options spidev bufsiz=65536
